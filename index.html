<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Network System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- White flash overlay -->
    <div id="flash-overlay"></div>

    <!-- Audio elements -->
    <div id="audio-container" style="display: none;">
        <!-- Background ambient music -->
        <audio id="bg-music" loop preload="auto">
            <!-- Placeholder: Add your ambient music file here -->
            <!-- <source src="audio/ambient-space.mp3" type="audio/mpeg"> -->
        </audio>

        <!-- Click sound effect -->
        <audio id="click-sound" preload="auto">
            <!-- Placeholder: Add your click sound file here -->
            <!-- <source src="audio/click.mp3" type="audio/mpeg"> -->
        </audio>
    </div>

    <!-- Camera container -->
    <div id="camera-container">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="hand-canvas"></canvas>
        <div id="camera-controls">
            <button id="toggle-camera">📷</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <!-- MediaPipe Hands for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
