<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Network System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="instructions">
        <div>Arrow Keys: Control wind direction</div>
        <div>Hand Gestures: Move hand to control all meshes (camera required)</div>
        <div>Click yellow grid to trigger abnormal state</div>
        <div>Mouse: Control black hole & absorb yellow grid</div>
    </div>

    <!-- Camera container -->
    <div id="camera-container">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="hand-canvas"></canvas>
        <div id="camera-controls">
            <button id="toggle-camera">📷 Start Camera</button>
        </div>
        <div id="camera-status"></div>
        <div id="gesture-indicator"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <!-- MediaPipe Hands for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
